[project]
name = "mrrc-ft8"
version = "1.1.0"
description = "Headless FT8/FT4 server (WSJT-X DSP core) with mobile web remote"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*"]
