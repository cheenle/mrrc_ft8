<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="f12title">
  <title id="f12title">图 12 CAT 串口争抢与 serial_guard 守卫</title>
  <defs>
    <marker id="f12-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--accent,#22d3ee)"/>
    </marker>
    <marker id="f12-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#34d399"/>
    </marker>
    <marker id="f12-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" rx="12" fill="var(--bg-tertiary,#10161e)"/>

  <!-- serial device -->
  <rect x="360" y="40" width="240" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="480" y="64" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">FT-710 CAT 串口</text>
  <text x="480" y="86" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" style="fill:var(--text-secondary,#8899aa)">/dev/cu.usbserial-0121DB3A0</text>

  <!-- two holders -->
  <rect x="80" y="150" width="220" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="190" y="174" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600" style="fill:var(--accent,#22d3ee)">rigctld</text>
  <text x="190" y="194" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:var(--text-secondary,#8899aa)">合法 owner（AD-008）</text>

  <rect x="680" y="150" width="240" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#f87171"/>
  <text x="800" y="174" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" style="fill:#f87171">mrrc_ft710 server.py</text>
  <text x="800" y="194" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:var(--text-secondary,#8899aa)">残留进程（PID 56041）</text>

  <!-- contention arrows -->
  <path d="M 190 150 V 98" fill="none" stroke-width="1.5" style="stroke:#f87171" marker-end="url(#f12-arrow)"/>
  <path d="M 800 150 V 98" fill="none" stroke-width="1.5" style="stroke:#f87171" marker-end="url(#f12-arrow)"/>
  <text x="480" y="130" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:#f59e0b">⚡ 字节争抢</text>

  <!-- consequence -->
  <text x="480" y="240" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--text-secondary,#8899aa)">18:00–22:20 rig 轮询 ~90% 超时（4 h）· wrong reply / Rig busy 数千条</text>
  <text x="480" y="262" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--text-secondary,#8899aa)">band_hunt 切频 5 次失败 · 停掉残留进程后立即恢复</text>

  <!-- divider -->
  <line x1="40" y1="288" x2="920" y2="288" stroke-width="1" stroke-dasharray="6 4" style="stroke:var(--border,rgba(255,255,255,0.06))"/>

  <!-- fix area -->
  <text x="480" y="310" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:#34d399">部署期守卫（V1.4 · AD-008）</text>

  <rect x="80" y="326" width="320" height="64" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#34d399"/>
  <text x="240" y="352" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="600" style="fill:#34d399">restart.sh serial_guard()</text>
  <text x="240" y="374" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" style="fill:var(--text-secondary,#8899aa)">lsof -t "$RIG_DEVICE" 检测持有者</text>

  <path d="M 400 358 H 446" fill="none" stroke-width="1.5" style="stroke:#34d399" marker-end="url(#f12-arrow-green)"/>

  <rect x="450" y="326" width="360" height="64" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#34d399"/>
  <text x="630" y="352" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" style="fill:#34d399">非 rigctld 持有 → fail-fast，拒绝启动</text>
  <text x="630" y="374" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-secondary,#8899aa)">列出持有者（PID + command）</text>

  <path d="M 630 390 V 412" fill="none" stroke-width="1.5" stroke-dasharray="6 4" style="stroke:#f59e0b" marker-end="url(#f12-arrow-amber)"/>

  <rect x="450" y="412" width="360" height="46" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" stroke-dasharray="5 4" style="stroke:#f59e0b"/>
  <text x="630" y="440" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:#f59e0b">MRRC_FT8_SKIP_SERIAL_GUARD=1 应急跳过</text>
</svg>
