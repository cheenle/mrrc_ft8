<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="f13title">
  <title id="f13title">图 13 实体名归一化：pskreporter → cty 规范名</title>
  <defs>
    <marker id="f13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--accent,#22d3ee)"/>
    </marker>
    <marker id="f13-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" rx="12" fill="var(--bg-tertiary,#10161e)"/>

  <text x="480" y="32" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" style="fill:var(--text-muted,#5c6370)">rank_bands 的 worked 判定先过别名表归一化（V1.5）</text>

  <!-- left column: pskreporter names -->
  <g text-anchor="middle">
    <rect x="60" y="60" width="200" height="44" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="160" y="87" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" style="fill:var(--text-secondary,#8899aa)">Germany</text>
    <rect x="60" y="130" width="200" height="44" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="160" y="157" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" style="fill:var(--text-secondary,#8899aa)">Malaysia</text>
    <rect x="60" y="200" width="200" height="44" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="160" y="227" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" style="fill:var(--text-secondary,#8899aa)">Turkey</text>
  </g>

  <!-- middle column: alias table -->
  <rect x="360" y="90" width="240" height="124" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="480" y="120" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="600" style="fill:var(--accent,#22d3ee)">_CTY_NAME_ALIASES</text>
  <text x="480" y="146" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--text-secondary,#8899aa)">_canonical_entity_name()</text>
  <text x="480" y="172" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:var(--text-secondary,#8899aa)">pskreporter 名 → cty 规范名</text>
  <text x="480" y="196" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-muted,#5c6370)">未知名称原样返回</text>

  <!-- left -> middle -->
  <g fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)">
    <path d="M 260 82 L 358 112" marker-end="url(#f13-arrow)"/>
    <path d="M 260 152 L 358 152" marker-end="url(#f13-arrow)"/>
    <path d="M 260 222 L 358 192" marker-end="url(#f13-arrow)"/>
  </g>

  <!-- right column: cty canonical names -->
  <g text-anchor="middle">
    <rect x="660" y="60" width="260" height="44" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
    <text x="790" y="87" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--text-primary,#ffffff)">Fed. Rep. of Germany</text>
    <rect x="660" y="130" width="260" height="44" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
    <text x="790" y="157" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--text-primary,#ffffff)">West Malaysia</text>
    <rect x="660" y="200" width="260" height="44" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
    <text x="790" y="227" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--text-primary,#ffffff)">Asiatic Turkey</text>
  </g>

  <!-- middle -> right -->
  <g fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)">
    <path d="M 600 112 L 658 82" marker-end="url(#f13-arrow)"/>
    <path d="M 600 152 L 658 152" marker-end="url(#f13-arrow)"/>
    <path d="M 600 192 L 658 222" marker-end="url(#f13-arrow)"/>
  </g>

  <!-- worked check -->
  <path d="M 790 244 V 278" fill="none" stroke-width="1.5" style="stroke:#34d399" marker-end="url(#f13-arrow-green)"/>
  <rect x="660" y="278" width="260" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#34d399"/>
  <text x="790" y="302" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="600" style="fill:#34d399">worked 判定 ✓</text>
  <text x="790" y="322" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-secondary,#8899aa)">Germany 不再判 new（qso 表 64 条 DL/DK）</text>

  <!-- bottom notes -->
  <text x="480" y="382" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:var(--text-muted,#5c6370)">42 个实测实体名中仅这 3 个不一致 · auto-call 的 is_new_dxcc 不受影响（两侧都用 cty.lookup）</text>
</svg>
