<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="f10title">
  <title id="f10title">图 10 安全不变量：单点 TX 门、STOP 优先、不自动恢复</title>
  <defs>
    <marker id="f10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--accent,#22d3ee)"/>
    </marker>
    <marker id="f10-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#f87171"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" rx="12" fill="var(--bg-tertiary,#10161e)"/>

  <!-- TX intent sources -->
  <g text-anchor="middle">
    <rect x="60" y="40" width="220" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
    <text x="170" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" style="fill:var(--text-primary,#ffffff)">Web UI / 人工操作</text>

    <rect x="370" y="40" width="220" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
    <text x="480" y="74" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" style="fill:var(--text-primary,#ffffff)">auto-call（system）</text>

    <rect x="680" y="40" width="220" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
    <text x="790" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" style="fill:var(--text-primary,#ffffff)">CQ 循环</text>
  </g>

  <!-- arrows into the single gate -->
  <g fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)">
    <path d="M 170 96 L 420 166" marker-end="url(#f10-arrow)"/>
    <path d="M 480 96 L 480 166" marker-end="url(#f10-arrow)"/>
    <path d="M 790 96 L 540 166" marker-end="url(#f10-arrow)"/>
  </g>

  <!-- the single TX gate (red) -->
  <rect x="320" y="170" width="300" height="120" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#f87171"/>
  <text x="470" y="202" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" style="fill:var(--text-primary,#ffffff)">SafetyController</text>
  <text x="470" y="224" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" style="fill:var(--text-secondary,#8899aa)">唯一 TX 门（AD-007）</text>
  <text x="470" y="248" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" style="fill:var(--text-secondary,#8899aa)">arm(): 互锁 CAT/audio/DSP/clock</text>
  <text x="470" y="266" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" style="fill:var(--text-secondary,#8899aa)">transmit(): faults/armed/PTT/预算 + watchdog</text>

  <path d="M 470 290 V 326" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f10-arrow)"/>

  <!-- PTT → rigctld → FT-710 -->
  <rect x="370" y="330" width="140" height="48" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="440" y="359" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">PTT</text>

  <path d="M 510 354 H 556" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f10-arrow)"/>

  <rect x="560" y="330" width="150" height="48" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="635" y="359" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">rigctld</text>

  <path d="M 710 354 H 756" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f10-arrow)"/>

  <rect x="760" y="330" width="150" height="48" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="835" y="359" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">FT-710</text>

  <!-- STOP box + arrow to PTT -->
  <rect x="680" y="120" width="240" height="90" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#f87171"/>
  <text x="800" y="150" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" style="fill:#f87171">STOP</text>
  <text x="800" y="174" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-secondary,#8899aa)">任何已认证会话（无需租约）</text>
  <text x="800" y="194" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-secondary,#8899aa)">幂等 · PTT-off 非阻塞</text>

  <path d="M 800 210 V 300 H 455 V 326" fill="none" stroke-width="1.5" stroke-dasharray="6 4" style="stroke:#f87171" marker-end="url(#f10-arrow-red)"/>

  <!-- bottom amber note -->
  <rect x="60" y="440" width="840" height="48" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#f59e0b"/>
  <text x="480" y="468" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" style="fill:#f59e0b">fault 清除后仍需人工 re-arm —— no-recovery-auto-resumes-TX</text>
</svg>
