<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1250" role="img" aria-labelledby="f1title">
  <title id="f1title">图 1 端到端链路总览：从空中解码到 worked 集刷新</title>
  <defs>
    <marker id="f1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--accent,#22d3ee)"/>
    </marker>
    <marker id="f1-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" style="fill:#34d399"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="1250" rx="12" fill="var(--bg-tertiary,#10161e)"/>

  <!-- stage 1: capture / decode (top wide box) -->
  <rect x="130" y="52" width="700" height="84" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="480" y="85" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" style="fill:#f59e0b">12 kHz int16 单声道（铁律）</text>
  <text x="480" y="112" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" style="fill:var(--text-primary,#ffffff)">FT-710 → capture_proc 子进程 → UtcRing(绝对序号) → DSP Worker</text>
  <text x="894" y="90" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-muted,#5c6370)">每 15 s slot</text>
  <text x="894" y="108" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" style="fill:var(--text-muted,#5c6370)">一批解码</text>

  <path d="M 480 136 V 186" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- stage 2: on_decode -->
  <rect x="130" y="186" width="700" height="56" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="480" y="219" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">orchestrator.on_decode（main.py）</text>

  <!-- branch to the two sub-boxes -->
  <path d="M 480 242 V 268 M 300 268 H 660" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <path d="M 300 268 V 294" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>
  <path d="M 660 268 V 294" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <rect x="130" y="294" width="340" height="96" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" stroke-opacity="0.7" style="stroke:var(--accent,#22d3ee)"/>
  <text x="300" y="322" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" style="fill:var(--text-primary,#ffffff)">1. DXCC cache 刷新</text>
  <text x="300" y="345" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" style="fill:var(--text-secondary,#8899aa)">dxcc_dirty 时同步重建，~0.2 s</text>
  <text x="300" y="368" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" style="fill:var(--text-secondary,#8899aa)">每 slot 至多一次</text>

  <rect x="490" y="294" width="340" height="96" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" stroke-opacity="0.7" style="stroke:var(--accent,#22d3ee)"/>
  <text x="660" y="322" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" font-weight="600" style="fill:var(--text-primary,#ffffff)">2. decode_message_view</text>
  <text x="660" y="345" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" style="fill:var(--text-secondary,#8899aa)">is_new_dxcc = lookup(call)</text>
  <text x="660" y="368" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" style="fill:var(--text-secondary,#8899aa)">∈ 实体 ∧ ∉ worked</text>

  <!-- merge back into the main chain -->
  <path d="M 300 390 V 414 M 660 390 V 414 M 300 414 H 660" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <path d="M 480 414 V 440" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- 3: candidate decision -->
  <rect x="130" y="440" width="700" height="84" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <circle cx="152" cy="482" r="12" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="152" y="486.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:var(--text-primary,#ffffff)">3</text>
  <text x="480" y="473" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">auto_call_candidate 决策（纯函数）</text>
  <text x="480" y="498" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" style="fill:var(--text-secondary,#8899aa)">开关开 ∧ 空闲 ∧ 无选择 ∧ is_new_dxcc ∧ is_cq ∧ ¬mine</text>

  <path d="M 480 524 V 574" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- 4: arm + reply -->
  <rect x="130" y="574" width="700" height="112" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <circle cx="152" cy="630" r="12" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="152" y="634.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:var(--text-primary,#ffffff)">4</text>
  <text x="480" y="604" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">_auto_call：safety.arm()（互锁门）→ sequencer.reply_to()</text>
  <text x="480" y="632" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" style="fill:var(--text-secondary,#8899aa)">tx_phase = 1 − slot%2 · tx_frequency = 伙伴解码频率（UC-003）</text>
  <text x="480" y="660" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:#f59e0b">失败 → 记日志跳过，下一 slot 重试 · audit 落 auto_call</text>

  <path d="M 480 686 V 736" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- 5: TX chain -->
  <rect x="130" y="736" width="700" height="84" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <circle cx="152" cy="778" r="12" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="152" y="782.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:var(--text-primary,#ffffff)">5</text>
  <text x="480" y="769" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">TX 链路：TxDriver（奇偶泵 + I9 窗口 + fit guard）</text>
  <text x="480" y="794" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" style="fill:var(--text-secondary,#8899aa)">next_tx_message() → dsp_encode 48 kHz → safety.transmit（PTT 门 + watchdog + 预算）</text>

  <path d="M 480 820 V 870" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- 6: QSO state machine -->
  <rect x="130" y="870" width="700" height="84" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <circle cx="152" cy="912" r="12" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="152" y="916.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:var(--text-primary,#ffffff)">6</text>
  <text x="480" y="903" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">sequencer QSO 状态机（NFR-055：1 发 + 3 重传）</text>
  <text x="480" y="928" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" style="fill:var(--text-secondary,#8899aa)">REPLYING → REPORT → ROGER_REPORT → ROGERS → SIGNOFF/DONE</text>

  <path d="M 480 954 V 1004" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- 7: persist (green) -->
  <rect x="130" y="1004" width="700" height="84" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#34d399"/>
  <circle cx="152" cy="1046" r="12" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#34d399"/>
  <text x="152" y="1050.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:var(--text-primary,#ffffff)">7</text>
  <text x="480" y="1037" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">落库：_ensure_log → on_qso → qso_log.enqueue → record_qso</text>
  <text x="480" y="1062" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" style="fill:var(--text-secondary,#8899aa)">qso 表 source='live' · dxcc_dirty = True</text>

  <path d="M 480 1088 V 1138" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)" marker-end="url(#f1-arrow)"/>

  <!-- 8: next slot closes the loop -->
  <rect x="130" y="1138" width="700" height="60" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <circle cx="152" cy="1168" r="12" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="152" y="1172.5" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" style="fill:var(--text-primary,#ffffff)">8</text>
  <text x="480" y="1173" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:var(--text-primary,#ffffff)">下一 slot：DXCC cache 重建 → 实体进 worked → 不再触发</text>

  <!-- green dashed loop-back: worked set closes the loop -->
  <path d="M 130 1168 H 66 V 482 H 130" fill="none" stroke-width="1.5" stroke-dasharray="6 4" style="stroke:#34d399" marker-end="url(#f1-arrow-green)"/>
  <text transform="translate(56 825) rotate(-90)" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12" style="fill:#34d399">worked 集闭环</text>
</svg>
