<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="f11title">
  <title id="f11title">图 11 TN8GD 频率根因：应答必须发在伙伴解码频率</title>

  <rect x="0" y="0" width="960" height="480" rx="12" fill="var(--bg-tertiary,#10161e)"/>

  <!-- Lane A: before fix -->
  <rect x="40" y="52" width="880" height="150" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#f87171"/>
  <text x="60" y="76" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" style="fill:#f87171">修复前（2026-08-07 现场）</text>

  <!-- baseline -->
  <line x1="70" y1="170" x2="910" y2="170" stroke-width="1" style="stroke:var(--border,rgba(255,255,255,0.06))"/>

  <!-- CQ @843 (cyan peak) -->
  <path d="M 242 170 L 287 92 L 332 170 Z" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <text x="287" y="80" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--accent,#22d3ee)">TN8GD CQ</text>
  <text x="287" y="96" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" style="fill:var(--accent,#22d3ee)">@843</text>

  <!-- reply @1500 (red peak) + own echo (gray small) -->
  <path d="M 435 170 L 480 96 L 525 170 Z" fill="none" stroke-width="1.5" style="stroke:#f87171"/>
  <text x="480" y="80" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" style="fill:#f87171">本台应答</text>
  <text x="480" y="96" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" style="fill:#f87171">@1500</text>

  <path d="M 458 170 L 480 150 L 502 170 Z" fill="var(--bg-secondary,#0d1117)" stroke-width="1" style="stroke:var(--text-secondary,#8899aa)"/>
  <text x="480" y="192" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" style="fill:var(--text-muted,#5c6370)">自身回波 @1500</text>

  <text x="700" y="168" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:#f87171">✗ 未配对 — 重传 4 次无应答，RETRY_EXHAUSTED</text>

  <!-- Lane B: after fix -->
  <rect x="40" y="232" width="880" height="150" rx="8" fill="var(--bg-secondary,#0d1117)" stroke-width="1.5" style="stroke:#34d399"/>
  <text x="60" y="256" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" style="fill:#34d399">UC-003 修复后</text>

  <line x1="70" y1="350" x2="910" y2="350" stroke-width="1" style="stroke:var(--border,rgba(255,255,255,0.06))"/>

  <!-- CQ @843 and reply @843 both (cyan + green) -->
  <path d="M 235 350 L 282 274 L 329 350 Z" fill="none" stroke-width="1.5" style="stroke:var(--accent,#22d3ee)"/>
  <path d="M 331 350 L 378 274 L 425 350 Z" fill="none" stroke-width="1.5" style="stroke:#34d399"/>
  <text x="310" y="262" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:var(--accent,#22d3ee)">CQ @843</text>
  <text x="378" y="262" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" style="fill:#34d399">应答 @843</text>
  <text x="378" y="378" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11.5" style="fill:#34d399">✓ split 配对 — 对方接收机能配对</text>

  <text x="700" y="300" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" style="fill:#34d399">应答必须发在伙伴解码频率</text>

  <!-- shared frequency axis -->
  <line x1="40" y1="430" x2="920" y2="430" stroke-width="1.5" style="stroke:var(--text-secondary,#8899aa)"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
    <line x1="40" y1="430" x2="40" y2="436" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="40" y="452" text-anchor="middle" style="fill:var(--text-secondary,#8899aa)">0</text>
    <line x1="187" y1="430" x2="187" y2="436" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="187" y="452" text-anchor="middle" style="fill:var(--text-secondary,#8899aa)">500</text>
    <line x1="287" y1="430" x2="287" y2="436" style="stroke:var(--accent,#22d3ee)"/>
    <text x="287" y="452" text-anchor="middle" style="fill:var(--accent,#22d3ee)">843</text>
    <line x1="480" y1="430" x2="480" y2="436" style="stroke:#f59e0b"/>
    <text x="480" y="452" text-anchor="middle" style="fill:#f59e0b">1500</text>
    <line x1="627" y1="430" x2="627" y2="436" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="627" y="452" text-anchor="middle" style="fill:var(--text-secondary,#8899aa)">2000</text>
    <line x1="773" y1="430" x2="773" y2="436" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="773" y="452" text-anchor="middle" style="fill:var(--text-secondary,#8899aa)">2500</text>
    <line x1="920" y1="430" x2="920" y2="436" style="stroke:var(--text-secondary,#8899aa)"/>
    <text x="920" y="452" text-anchor="middle" style="fill:var(--text-secondary,#8899aa)">3000</text>
  </g>
  <text x="480" y="472" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10.5" style="fill:var(--text-muted,#5c6370)">TX 音频频率（Hz）— 旧行为写死 1500 Hz，与 TN8GD 的 CQ（f=843 Hz）离频</text>
</svg>
